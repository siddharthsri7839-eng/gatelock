<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GateLock | Bio S-B251CB Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-slate-50 to-indigo-50 text-slate-800 min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">
    <div class="w-full max-w-md">
        <!-- Logo & Brand Header -->
        <div class="text-center mb-8">
            <div class="relative inline-block">
                <div class="w-28 h-28 mx-auto rounded-3xl p-1 bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 shadow-xl shadow-blue-500/25 mb-4 transition-transform hover:scale-105 duration-300">
                    <img src="/logo.jpeg" alt="GateLock Logo" class="w-full h-full object-cover rounded-[22px] bg-white shadow-inner">
                </div>
                <span class="absolute -bottom-1 -right-1 flex h-4 w-4">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-white"></span>
                </span>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-slate-900 flex items-center justify-center gap-2">
                <span>GateLock<span class="text-blue-600">Pro</span></span>
                <span class="text-xs uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-bold border border-blue-200">Bio S-B251CB</span>
            </h1>
            <p class="text-sm text-slate-500 mt-1 font-medium">Dual Gate Biometric Access Control & Live Monitor</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white border border-slate-200/90 rounded-3xl p-8 shadow-xl shadow-blue-500/5 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500"></div>

            <div id="errorBox" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
                <span id="errorMessage">Invalid credentials</span>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required autocomplete="username" placeholder="owner or admin" 
                               class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Password</label>
                        <span class="text-[11px] text-blue-600 font-mono font-semibold">Default: admin123</span>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="admin123" 
                               class="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 focus:bg-white rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
                        <!-- Eye Toggle Button -->
                        <button type="button" onclick="togglePasswordVisibility()" 
                                class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-700 transition-colors focus:outline-none" 
                                title="Click to view/hide password">
                            <i id="eyeIcon" class="fa-solid fa-eye text-base"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center gap-2 text-sm">
                    <span id="btnText">Sign In to Gate Portal</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Quick Role Selectors for testing -->
            <div class="mt-8 pt-6 border-t border-slate-100">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 text-center mb-3">Quick Demo Access</p>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="fillCredentials('owner', 'owner123')" 
                            class="p-3 bg-blue-50/70 hover:bg-blue-100/70 border border-blue-200/80 rounded-xl text-left transition-all group shadow-sm">
                        <div class="flex items-center gap-2 text-blue-700 text-xs font-bold mb-1">
                            <i class="fa-solid fa-eye text-xs"></i>
                            <span>Owner Portal</span>
                        </div>
                        <p class="text-[11px] text-slate-600">View-only live monitoring of all movements</p>
                    </button>

                    <button type="button" onclick="fillCredentials('admin', 'admin123')" 
                            class="p-3 bg-emerald-50/70 hover:bg-emerald-100/70 border border-emerald-200/80 rounded-xl text-left transition-all group shadow-sm">
                        <div class="flex items-center gap-2 text-emerald-700 text-xs font-bold mb-1">
                            <i class="fa-solid fa-shield-halved text-xs"></i>
                            <span>Admin Portal</span>
                        </div>
                        <p class="text-[11px] text-slate-600">Manage records, wipe bio data & users</p>
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6 font-medium">
            GateLock Access Control System • Bio S-B251CB Gate Controller
        </p>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
                eyeIcon.classList.add('text-blue-600');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.remove('text-blue-600');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.textContent = "Authenticating...";

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('gatelock_user', JSON.stringify(data));
                    window.location.href = '/dashboard';
                } else {
                    errorMessage.textContent = data.detail || 'Login failed';
                    errorBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = "Sign In to Gate Portal";
                }
            } catch (err) {
                errorMessage.textContent = 'Server connection failed';
                errorBox.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.textContent = "Sign In to Gate Portal";
            }
        });
    </script>
</body>
</html>
